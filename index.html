
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillShare - Learn Together</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Skill<span>Share</span></h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#skills">Explore Skills</a>
            <a href="#about">About</a>
        </nav>
        <button onclick="showLogin()">Login</button>
    </header>

    <section class="hero" id="home">
        <h2>Learn Skills. Share Knowledge.</h2>
        <p>Connect with students, learn new skills and grow together.</p>
        <button onclick="showLogin()">Get Started</button>
    </section>

    <section class="skills" id="skills">
        <h2>Explore Skills</h2>

        <div class="skill-container">
            <div class="skill-card">🌐<h3>Web Development</h3></div>
            <div class="skill-card">☕<h3>Java</h3></div>
            <div class="skill-card">💻<h3>C++</h3></div>
            <div class="skill-card">🧠<h3>DSA</h3></div>
            <div class="skill-card">🐍<h3>Python</h3></div>
            <div class="skill-card">📊<h3>Data Science</h3></div>
        </div>
    </section>

    <section class="login-section" id="login">
        <h2>Join SkillShare</h2>
        <input type="text" id="username" placeholder="Enter your name">
        <input type="email" id="email" placeholder="Enter your email">
        <button onclick="createProfile()">Create Profile</button>
        <p id="message"></p>
    </section>

    <footer id="about">
        <p>SkillShare © 2026 | Learn Together, Grow Together</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
